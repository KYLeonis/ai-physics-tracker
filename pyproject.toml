[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-physics-tracker"
version = "0.1.0"
description = "Desktop video tracking and physics analysis foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Leonis" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
