[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-physics-tracker"
version = "0.1.0"
description = "Desktop video tracking and physics analysis foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Leonis" }]
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "PySide6-Essentials>=6.5,<7",
    "scipy>=1.12,<2.0",
    "pyqtgraph>=0.13,<0.14",
    "deeplabcut>=3.0,<4.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
