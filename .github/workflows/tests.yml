name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Install checksum-verified FFprobe
        run: python scripts/setup_ffprobe.py --directory "${{ runner.temp }}/ffprobe" --github-path
      - name: Verify FFprobe
        run: ffprobe -version
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m pytest
      # 诊断分支专用：cdb 常驻拦截 0xc0000374/0xc0000005，打印 native 栈并保存 minidump。
      # 注意：不能用 -g（会跳过初始断点导致 -cf 脚本不执行）。
      - name: Write cdb script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @"
          .symfix
          .reload
          sxe -c "kn 80; .dump /ma ${{ runner.temp }}\crash.dmp; q" 0xc0000374
          sxe -c "kn 80; .dump /ma ${{ runner.temp }}\crash_av.dmp; q" 0xc0000005
          g
          "@
          Set-Content -Path cdb_script.txt -Value $script -Encoding ascii
      - name: Run tests under cdb (Windows diagnostics)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if ($null -eq $cdb) {
            Write-Host "cdb not found, falling back to plain pytest"
            python -m pytest
            exit $LASTEXITCODE
          }
          & $cdb.FullName -cf cdb_script.txt -logo pytest_cdb.log python -m pytest -s
          $code = $LASTEXITCODE
          Get-Content pytest_cdb.log -Tail 500
          exit $code
      - name: Upload crash dump
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dump-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/crash.dmp
            ${{ runner.temp }}/crash_av.dmp
            pytest_cdb.log
          if-no-files-found: ignore

  bisect:
    name: Windows bisect — ${{ matrix.slice }}
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        slice:
          - only_chart_request
          - skip_chart_request
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Install checksum-verified FFprobe
        run: python scripts/setup_ffprobe.py --directory "${{ runner.temp }}/ffprobe" --github-path
      - name: Run slice
        shell: pwsh
        run: |
          if ("${{ matrix.slice }}" -eq "only_chart_request") {
            python -m pytest -s tests/gui/test_chart_request_identity.py tests/gui/test_charts.py tests/gui/test_chart_help.py
          } else {
            python -m pytest -s tests/gui --ignore=tests/gui/test_chart_request_identity.py --ignore=tests/gui/test_zz_probe_leak.py
          }
